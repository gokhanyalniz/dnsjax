name: Release

# Inert until a maintainer acts: pushing a v* tag publishes to PyPI and
# drafts the GitHub release; running the workflow by hand rehearses on
# TestPyPI.  Three jobs: `build` makes and checks the artefacts, with no
# approval and no publishing rights; `publish` uploads exactly those
# files through trusted publishing, behind its environment's required
# reviewer, which gates that job alone, so a tag's checks have passed
# before its reviewer is asked; `draft` (a tag only) drafts the GitHub
# release.  The Zenodo deposit of the tag's source archive is the
# maintainer's, by hand, between the checks and the approval
# (CONTRIBUTING.md, "Releases").
#
# A tag must point at a release commit cut by
# lab/scripts/release/prepare_release.py: the solver alone in
# pyproject.toml and uv.lock, so that the sdist and the zipball, which
# carry no lock, both install with uv.  A rehearsal builds from main,
# stripped the same way.  The GitHub release alone also carries the
# repository but for the files written for coding agents (the lab, the
# contributor guide, uv's files and the development configuration in),
# as an asset built from the tag's parent commit.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build and check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1

      - name: The tag points at a release commit
        if: github.event_name == 'push'
        run: |
          set -eu
          if grep -q dnsjax-lab pyproject.toml; then
            echo "pyproject.toml names the lab: cut the tag with"
            echo "lab/scripts/release/prepare_release.py"
            exit 1
          fi

      - name: A rehearsal strips the lab, as a release commit does
        if: github.event_name == 'workflow_dispatch'
        run: uv run --no-project python lab/scripts/release/prepare_release.py strip

      - name: The tag, pyproject.toml and CITATION.cff name one version
        if: github.event_name == 'push'
        run: |
          set -eu
          tag="${GITHUB_REF_NAME#v}"
          project=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          cff=$(sed -n 's/^version: *//p' CITATION.cff)
          echo "tag ${tag}, pyproject.toml ${project}, CITATION.cff ${cff}"
          [ "$tag" = "$project" ] && [ "$tag" = "$cff" ]

      - run: uv build --package dnsjax --out-dir dist

      - name: The sdist and the wheel hold no lab code and no agent notes
        run: |
          set -eu
          ls dist
          if tar -tzf dist/dnsjax-*.tar.gz | grep -E '(^|/)(lab|dnsjax_lab)(/|$)|CLAUDE\.md|/\.claude/'; then
            echo "the sdist carries lab or agent files"
            exit 1
          fi
          if python3 -m zipfile -l dist/dnsjax-*.whl | grep -E 'dnsjax_lab|CLAUDE\.md'; then
            echo "the wheel carries lab or agent files"
            exit 1
          fi

      - name: The sdist and the archive hold the same files
        run: |
          set -eu
          git archive -o "$RUNNER_TEMP/archive.tar" HEAD
          uv run --no-project python lab/scripts/release/prepare_release.py \
            files dist/dnsjax-*.tar.gz "$RUNNER_TEMP/archive.tar"

      # What Zenodo will archive: GitHub's zipball of the tag, which
      # honours the .gitattributes export-ignore of lab/, the agent
      # notes, the contributor guide and the development configuration,
      # uv.lock included: the sdist's files.  It must install with uv
      # without a lock.  The tarball, the release page's other source
      # archive, is made the same way.
      - name: The tag's zipball and tarball hold no lab or agent files
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          curl -sSfL -H "Authorization: Bearer ${GH_TOKEN}" \
            -o zipball.zip "${api}/zipball/${GITHUB_REF_NAME}"
          curl -sSfL -H "Authorization: Bearer ${GH_TOKEN}" \
            -o "$RUNNER_TEMP/tarball.tar.gz" "${api}/tarball/${GITHUB_REF_NAME}"
          if python3 -m zipfile -l zipball.zip | grep -E '/lab/|CLAUDE\.md|/\.claude/'; then
            echo "the release zipball carries lab or agent files"
            exit 1
          fi
          if tar -tzf "$RUNNER_TEMP/tarball.tar.gz" | grep -E '/lab/|CLAUDE\.md|/\.claude/'; then
            echo "the release tarball carries lab or agent files"
            exit 1
          fi
          uv run --no-project python lab/scripts/release/prepare_release.py \
            files dist/dnsjax-*.tar.gz zipball.zip

      - name: The tag's zipball installs with uv
        if: github.event_name == 'push'
        run: |
          set -eu
          mkdir zipball && python3 -m zipfile -e zipball.zip zipball
          cd zipball/*/
          uv sync
          uv run python -c "import dnsjax.flows.registry as r; print(r.all_systems())"

      - name: The wheel alone installs and runs
        run: |
          set -eu
          uv venv --python 3.12 "$RUNNER_TEMP/core"
          uv pip install --python "$RUNNER_TEMP/core/bin/python" dist/dnsjax-*.whl
          "$RUNNER_TEMP/core/bin/dnsjax" --help > /dev/null
          "$RUNNER_TEMP/core/bin/dnsjax" --sample-toml pipe > /dev/null

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: publish (after the reviewer's approval)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ github.event_name == 'push' && 'pypi' || 'testpypi' }}
    permissions:
      id-token: write # trusted publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Publish to TestPyPI (rehearsal)
        if: github.event_name == 'workflow_dispatch'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          # A rehearsal may repeat a version; the real publish may not.
          skip-existing: true

      - name: Publish to PyPI
        if: github.event_name == 'push'
        uses: pypa/gh-action-pypi-publish@release/v1

  draft:
    name: draft the GitHub release
    if: github.event_name == 'push'
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # the draft release
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2 # the tag's parent too, for the with-lab asset
      - uses: astral-sh/setup-uv@v10.0.1
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      # The tag's parent is the commit the release was cut from.  The
      # asset holds its every file but those written for coding agents
      # (prepare_release.py asset), so everything the zipball leaves out
      # is back in: the lab, the contributor guide, uv's files and the
      # development configuration (the hooks, git and CI settings a
      # reader of the contributor guide needs).  GitHub readers get it
      # as an asset; deleting the release deletes it.
      - name: Draft the GitHub release, the repository with the lab attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          asset="$RUNNER_TEMP/dnsjax-${version}-with-lab.tar.gz"
          uv run --no-project python lab/scripts/release/prepare_release.py \
            asset HEAD^ "$asset" --prefix "dnsjax-${version}-with-lab/"
          if tar -tzf "$asset" | grep -E 'CLAUDE\.md|/\.claude/'; then
            echo "the with-lab asset carries agent files"
            exit 1
          fi
          for f in lab/pyproject.toml CONTRIBUTING.md uv.lock prek.toml \
            .gitignore .gitattributes .github/workflows/release.yml; do
            tar -tzf "$asset" | grep -q "/${f}\$"
          done
          gh release create "${GITHUB_REF_NAME}" dist/* "$asset" --draft \
            --verify-tag --generate-notes \
            --title "dnsjax ${GITHUB_REF_NAME}"
