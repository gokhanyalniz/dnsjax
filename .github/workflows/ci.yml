name: CI

on:
  push:
    # Branches only: a release tag points at its own commit, which has
    # no lab to test (lab/scripts/release/prepare_release.py);
    # release.yml checks it instead.
    branches: ["**"]
  pull_request:
  schedule:
    # Mondays, 05:00 UTC — the full offline suite.
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # The event name keeps a push to main from cancelling the weekly run.
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The suite is CPU-only; nothing here needs (or should try to find) a
  # GPU. dnsjax pins one XLA thread per rank, so runs are single-threaded.
  JAX_PLATFORMS: cpu

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # setup-uv stopped publishing a floating major tag after v7, so
      # this is pinned exactly rather than to a major.
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run ruff check
      # Named directories on purpose: a bare `ruff format` also rewrites
      # the Python blocks in the Markdown docs and the example notebook,
      # which are laid out to be read.
      - run: uv run ruff format --check src tests scripts lab/src lab/tests lab/scripts
      # The PyPI copy of the README must follow every README change.
      - run: uv run python lab/scripts/release/pypi_readme.py --check

  smoke:
    name: smoke (CPU, Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The floor from pyproject, and the version .python-version pins
        # for development. Both are run in full offline locally.
        python: ["3.12", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      # uv provisions the interpreter itself; nothing else is needed.
      - run: uv sync

      - name: Parameter surfaces render without touching a device
        run: |
          uv run dnsjax --help
          uv run dnsjax --help pipe
          uv run dnsjax --sample-toml pipe
          uv run dnsjax-twin --help

      - name: The analysis API imports without JAX
        run: |
          uv run python -c "
          import sys
          import dnsjax.analysis
          assert 'jax' not in sys.modules, 'dnsjax.analysis pulled in JAX'
          print('dnsjax.analysis is JAX-free')
          "

      # The fast half of the offline suite: the core/lab layering,
      # plugin discovery, the parameter surfaces, bootstrap decisions,
      # FFT padding, the mean-mode mask, quadrature, the run-loop hooks,
      # the JAX-free analysis API against solver ground truth (the
      # surfaces and the API in a core and a lab half each), and the
      # four response readers/identifiers.  ~2.5 min locally; the rest
      # of the offline suite runs weekly in full-cpu below.
      - name: Fast test scripts
        run: |
          set -u
          failed=""
          for t in \
            tests/test_layering \
            tests/test_plugins \
            tests/test_bootstrap \
            tests/test_param_surface \
            lab/tests/test_param_surface \
            tests/test_padding \
            tests/test_mean_mask \
            tests/test_integration \
            tests/test_run_hooks \
            tests/test_snapshot_export \
            lab/tests/test_snapshot_export \
            lab/tests/response/test_probes_reader \
            lab/tests/response/test_operator_tools \
            lab/tests/response/test_lim \
            lab/tests/response/test_ssi
          do
            echo "::group::$t.py"
            if ! uv run python "$t.py"; then
              failed="$failed $t"
            fi
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "failed:$failed"
            exit 1
          fi

  # What a release ships: the root package alone, built from the
  # pyproject.toml a release commit has (the lab stripped out),
  # installed into an environment that has never seen the lab, and a
  # lab-free tree that installs with uv as the release zipball must.
  core-only:
    name: core release artefacts (no lab)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - run: uv run --no-project python lab/scripts/release/prepare_release.py strip
      - run: uv build --package dnsjax --out-dir dist

      - name: The sdist and the wheel hold no lab code and no agent notes
        run: |
          set -eu
          ls dist
          if tar -tzf dist/dnsjax-*.tar.gz | grep -E '(^|/)(lab|dnsjax_lab)(/|$)|CLAUDE\.md|/\.claude/'; then
            echo "the sdist carries lab or agent files"
            exit 1
          fi
          if python3 -m zipfile -l dist/dnsjax-*.whl | grep -E 'dnsjax_lab|CLAUDE\.md'; then
            echo "the wheel carries lab or agent files"
            exit 1
          fi
          if tar -xzOf dist/dnsjax-*.tar.gz --wildcards '*/pyproject.toml' | grep dnsjax-lab; then
            echo "the sdist's pyproject.toml names the lab"
            exit 1
          fi

      - name: The sdist holds the archive's files, the archive adds uv.lock
        run: |
          set -eu
          git archive -o "$RUNNER_TEMP/archive.tar" HEAD
          uv run --no-project python lab/scripts/release/prepare_release.py \
            files dist/dnsjax-*.tar.gz "$RUNNER_TEMP/archive.tar"

      # The floor Python, the wheel and its dependencies only.
      - name: The wheel alone renders every flow's surface
        run: |
          set -eu
          uv venv --python 3.12 "$RUNNER_TEMP/core"
          uv pip install --python "$RUNNER_TEMP/core/bin/python" dist/dnsjax-*.whl
          for s in plane-couette plane-poiseuille pipe taylor-couette kolmogorov; do
            "$RUNNER_TEMP/core/bin/dnsjax" --help "$s" > /dev/null
            "$RUNNER_TEMP/core/bin/dnsjax" --sample-toml "$s" > /dev/null
          done
          "$RUNNER_TEMP/core/bin/python" - <<'PY'
          import sys
          from importlib.metadata import entry_points

          import dnsjax.analysis

          assert "jax" not in sys.modules, "dnsjax.analysis pulled in JAX"
          for group in ("dnsjax.flows", "dnsjax.parameters", "dnsjax.extensions"):
              assert not entry_points(group=group), f"{group} is not empty"
          from dnsjax.flows.registry import all_systems

          print("systems:", ", ".join(all_systems()))
          PY

      # Run from the checkout, but importing the installed wheel: the
      # scripts put tests/ on the path, never src/.  test_run_hooks
      # steps the solver from the wheel.
      - name: Fast core scripts against the installed wheel
        run: |
          set -u
          failed=""
          for t in \
            tests/test_layering \
            tests/test_plugins \
            tests/test_bootstrap \
            tests/test_param_surface \
            tests/test_padding \
            tests/test_mean_mask \
            tests/test_integration \
            tests/test_run_hooks \
            tests/test_snapshot_export
          do
            echo "::group::$t.py"
            if ! "$RUNNER_TEMP/core/bin/python" "$t.py"; then
              failed="$failed $t"
            fi
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "failed:$failed"
            exit 1
          fi

      # The release tag's GitHub archive, which Zenodo keeps, is what
      # `git archive` gives under .gitattributes.
      - name: The archive holds no lab and no agent files
        run: |
          set -eu
          if git archive HEAD | tar -t | grep -E '^lab/|CLAUDE\.md|^\.claude/'; then
            echo "git archive carries lab or agent files"
            exit 1
          fi

      # Last: it removes the lab from the checkout.
      - name: A tree without the lab installs with uv sync
        run: |
          set -eu
          rm -rf lab
          uv lock
          uv sync
          uv run python -c "import dnsjax.flows.registry as r; print(r.all_systems())"

  full-cpu:
    name: full offline suite (CPU)
    # Weekly and on demand only: the whole offline suite is far too long
    # for every push.  On main, the release line, the released solver
    # is tested alone: the lab left out of the environment, so its
    # rows skip and the core suite runs as a release ships it.  On any
    # other branch both suites run.  No mpirun on the runner, so the
    # mpi rows skip themselves; the slow rows are solver integrations
    # measured in minutes each.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - name: The released solver alone (main)
        if: github.ref == 'refs/heads/main'
        run: |
          uv sync --no-group lab --group plots
          uv run --no-group lab --group plots pytest -m "not slow and not mpi"
      - name: Both suites (any other branch)
        if: github.ref != 'refs/heads/main'
        run: |
          uv sync --group plots
          uv run pytest -m "not slow and not mpi"
