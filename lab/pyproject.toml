[project]
name = "dnsjax-lab"
version = "0.1.0"
description = "Features of dnsjax in development, kept out of its releases: further flows, twin runs and response analysis."
authors = [
    { name = "Gökhan Yalnız" }
]
requires-python = ">=3.12"
license = "MIT"
# PyPI refuses any upload carrying a "Private ::" classifier: this
# package lives in the dnsjax repository only and is never published.
classifiers = [
    "Private :: Do Not Upload",
]
dependencies = [
    "dnsjax",
    "scipy>=1.18.0",
]

[project.scripts]
dnsjax-twin = "dnsjax_lab.twin.driver:main"

[tool.uv.sources]
dnsjax = { workspace = true }

[build-system]
requires = ["uv_build>=0.11.4,<0.13.0"]
build-backend = "uv_build"

[project.entry-points."dnsjax.flows"]
lab = "dnsjax_lab.flows:SPECS"

[project.entry-points."dnsjax.parameters"]
lab = "dnsjax_lab.parameters:FIELDS"

[project.entry-points."dnsjax.extensions"]
lab = "dnsjax_lab.extensions"
