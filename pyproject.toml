[project]
name = "dnsjax"
version = "0.1.0"
description = "A GPU-accelerated pseudo-spectral solver for direct numerical simulation of the 3D incompressible Navier–Stokes equations, written in JAX."
# The README rewritten for PyPI (absolute links, plain math), generated
# from README.md by lab/scripts/release/pypi_readme.py.
readme = "docs/pypi/README.md"
authors = [
    { name = "Gökhan Yalnız", email = "g.yalniz@imperial.ac.uk" }
]
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
keywords = [
    "jax",
    "cfd",
    "turbulence",
    "dns",
    "direct-numerical-simulation",
    "navier-stokes",
    "pseudo-spectral",
    "gpu",
    "pallas",
    "hpc",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: GPU :: NVIDIA CUDA",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "jax>=0.9.2",
    "numpy>=2.5.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.13.0",
    "scipy>=1.18.0",
    "tensorstore>=0.1.71",
]

[project.scripts]
dnsjax = "dnsjax.__main__:main"

[project.urls]
Repository = "https://github.com/gokhanyalniz/dnsjax"
Documentation = "https://github.com/gokhanyalniz/dnsjax#readme"

[dependency-groups]
dev = [
    "prek>=0.3.3",
    "pytest>=8",
    "ruff>=0.15.0",
]
plots = [
    "matplotlib>=3.10",
]
# The unpublished workspace member (lab/), installed by default so one
# `uv sync` gives the whole codebase; `--no-group lab` leaves it out.
lab = [
    "dnsjax-lab",
]

[tool.uv]
default-groups = ["dev", "lab"]

[tool.uv.workspace]
members = ["lab"]

[tool.uv.sources]
dnsjax-lab = { workspace = true }

[build-system]
requires = ["uv_build>=0.11.4,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# No agent notes in a release: the CLAUDE.md files beside the code stay
# out of both artefacts.
source-exclude = ["**/CLAUDE.md"]
wheel-exclude = ["**/CLAUDE.md"]

[tool.pytest.ini_options]
# The core suite, then the lab's (lab/ is absent from a release).
testpaths = ["tests", "lab/tests"]
# Only the subprocess bridges are collected: the standalone test_*.py
# scripts configure JAX / global singletons at module import, so
# pytest must never import them (see tests/_bridge.py).
python_files = ["pytest_suite.py"]
# Stream the scripts' output live (tests/_live.py tees it); failure
# reports stay compact via the bridge's own output-tail message.  The
# two bridges share a file name, which importlib mode allows.
addopts = "-s --import-mode=importlib"
markers = [
    "mpi: launches solver runs via mpirun (skipped when mpirun is missing)",
    "slow: full solver integration runs / dt sweeps (minutes each)",
]

[tool.ruff]
# Set the maximum line length to 79.
line-length = 79

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
]
