[project]
name = "dnsjax"
version = "0.1.0.1"
description = "A GPU-accelerated pseudo-spectral solver for direct numerical simulation of the 3D incompressible Navier–Stokes equations, written in JAX."
# The README rewritten for PyPI (absolute links, plain math): a
# release's README.md is that copy (lab/scripts/release/).
readme = "README.md"
authors = [
    { name = "Gökhan Yalnız" }
]
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = [
    "jax",
    "cfd",
    "turbulence",
    "dns",
    "direct-numerical-simulation",
    "navier-stokes",
    "pseudo-spectral",
    "gpu",
    "pallas",
    "hpc",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: GPU :: NVIDIA CUDA",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "jax>=0.9.2",
    "numpy>=2.5.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.13.0",
    "tensorstore>=0.1.71",
]

# JAX's accelerator plugins as extras of the same names, one per
# environment: `pip install "dnsjax[cuda13]"`, `uv add "dnsjax[cuda13]"`
# or, in a clone, `uv sync --extra cuda13` installs the solver with its
# backend (the README's Quick start).  `cpu` names the default install.
# lab/scripts/release/check_extras.py checks each against JAX's.
[project.optional-dependencies]
cpu = ["jax[cpu]"]
cuda12 = ["jax[cuda12]"]
cuda13 = ["jax[cuda13]"]
cuda12-local = ["jax[cuda12-local]"]
cuda13-local = ["jax[cuda13-local]"]
tpu = ["jax[tpu]"]
rocm7-local = ["jax[rocm7-local]"]
oneapi = ["jax[oneapi]"]

[project.scripts]
dnsjax = "dnsjax.__main__:main"

[project.urls]
Repository = "https://github.com/gokhanyalniz/dnsjax"
Documentation = "https://github.com/gokhanyalniz/dnsjax#readme"

[dependency-groups]
dev = [
    "prek>=0.3.3",
    "pytest>=8",
    "ruff>=0.15.0",
]
plots = [
    "matplotlib>=3.10",
]

[tool.uv]
default-groups = ["dev"]

[build-system]
requires = ["uv_build>=0.11.4,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# The sdist holds what the release archive does (.gitattributes): the
# package, its tests, docs, examples and scripts, the README and the
# citation.  Neither it nor the wheel holds an agent note (a CLAUDE.md
# beside the code) or the contributor guide (CONTRIBUTING.md).
source-include = [
    "tests/**",
    "docs/**",
    "examples/**",
    "scripts/**",
    "README.md",
    "CITATION.cff",
]
source-exclude = ["**/CLAUDE.md"]
wheel-exclude = ["**/CLAUDE.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Only the subprocess bridges are collected: the standalone test_*.py
# scripts configure JAX / global singletons at module import, so
# pytest must never import them (see tests/_bridge.py).
python_files = ["pytest_suite.py"]
# Stream the scripts' output live (tests/_live.py tees it); failure
# reports stay compact via the bridge's own output-tail message.  The
# two bridges share a file name, which importlib mode allows.
addopts = "-s --import-mode=importlib"
markers = [
    "mpi: launches solver runs via mpirun (skipped when mpirun is missing)",
    "slow: full solver integration runs / dt sweeps (minutes each)",
]

[tool.ruff]
line-length = 79

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
]
