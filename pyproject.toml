[project]
name = "dnsjax"
version = "0.1.0"
description = "A GPU-accelerated & parallelized pseudo-spectral solver for direct numerical simulations of Navier–Stokes equations in JAX."
authors = [
    { name = "Gökhan Yalnız", email = "gokhan.yalniz@ista.ac.at" }
]
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
keywords = [
    "jax",
    "cfd",
    "turbulence",
    "dns",
    "direct-numerical-simulation",
    "navier-stokes",
    "pseudo-spectral",
    "gpu",
    "pallas",
    "hpc",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: GPU :: NVIDIA CUDA",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "jax>=0.9.2",
    "numpy>=2.5.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.13.0",
    "scipy>=1.18.0",
    "tensorstore>=0.1.71",
]

[project.scripts]
dnsjax = "dnsjax.__main__:main"
dnsjax-twin = "dnsjax.twin.driver:main"

[project.urls]
Repository = "https://github.com/gokhanyalniz/dnsjax"
Documentation = "https://github.com/gokhanyalniz/dnsjax#readme"

[dependency-groups]
dev = [
    "prek>=0.3.3",
    "pytest>=8",
    "ruff>=0.15.0",
]
plots = [
    "matplotlib>=3.10",
]

[build-system]
requires = ["uv_build>=0.11.4,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Only the subprocess bridge is collected: the standalone test_*.py
# scripts configure JAX / global singletons at module import, so
# pytest must never import them (see tests/pytest_suite.py).
python_files = ["pytest_suite.py"]
# Stream the scripts' output live (tests/_live.py tees it); failure
# reports stay compact via the bridge's own output-tail message.
addopts = "-s"
markers = [
    "mpi: launches solver runs via mpirun (skipped when mpirun is missing)",
    "slow: full solver integration runs / dt sweeps (minutes each)",
]

[tool.ruff]
# Set the maximum line length to 79.
line-length = 79

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
]
