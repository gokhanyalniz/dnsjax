[project]
name = "dnsjax"
version = "0.1.0"
description = "A GPU-accelerated & parallelized pseudo-spectral solver for direct numerical simulations of Navier–Stokes equations in JAX."
authors = [
    { name = "Gökhan Yalnız", email = "gokhan.yalniz@ista.ac.at" }
]
requires-python = ">=3.14"
dependencies = [
    "jax>=0.9.2",
    "pydantic-settings>=2.13.0",
    "tensorstore>=0.1.71",
]

[project.optional-dependencies]
# Extras for `dnsjax.analysis.response` (imported lazily in-function).
analysis = [
    "scipy>=1.14",
]

[project.scripts]
dnsjax = "dnsjax.__main__:main"

[dependency-groups]
dev = [
    "prek>=0.3.3",
    "pytest>=8",
    "ruff>=0.15.0",
    "scipy>=1.14",
]

[build-system]
requires = ["uv_build>=0.11.4,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Only the subprocess bridge is collected: the standalone test_*.py
# scripts configure JAX / global singletons at module import, so
# pytest must never import them (see tests/pytest_suite.py).
python_files = ["pytest_suite.py"]
markers = [
    "mpi: launches solver runs via mpirun (skipped when mpirun is missing)",
    "slow: full solver integration runs / dt sweeps (minutes each)",
]

[tool.ruff]
# Set the maximum line length to 79.
line-length = 79

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
]
